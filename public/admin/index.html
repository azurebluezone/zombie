<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZombieCoder · Admin Control Plane</title>
<style>
/* Self-contained design system (no CDN): the runtime serves /admin under a strict
   CSP (default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';
   connect-src 'self'), so the panel must ship zero external assets. The look
   mirrors public/models.html: near-black canvas, #0d1015 sidebar, emerald accent. */
:root{
  --bg:#090b0e; --sidebar:#0d1015; --line:#1a1f2c; --line2:#232b3d;
  --panel:#0c0e14; --panel2:#0f121a; --hover:#141924; --active:#13231f;
  --input:#10141d; --inputline:#1e2533;
  --text:#e2e8f0; --muted:#94a3b8; --muted2:#64748b;
  --ok:#34d399; --okline:rgba(16,185,129,.35); --warn:#fbbf24; --bad:#fb7185; --accent:#10b981;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;overflow:hidden}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:#0d1015}
::-webkit-scrollbar-thumb{background:#1f2533;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#2a3245}
a{color:inherit;text-decoration:none}
.app{display:flex;height:100vh}
/* ---------- sidebar ---------- */
.sidebar{width:256px;flex:0 0 256px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;z-index:40}
.brand{height:56px;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand-badge{width:28px;height:28px;border-radius:9px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);display:flex;align-items:center;justify-content:center;color:var(--ok);font-weight:700;box-shadow:0 1px 2px rgba(16,185,129,.1)}
.brand-title{font-weight:600;font-size:13px;letter-spacing:-.01em;color:#fff}
.brand-sub{font-size:10px;color:var(--muted2);letter-spacing:.02em}
.nav{flex:1;overflow-y:auto;padding:12px}
.nav-group{margin-bottom:20px}
.nav-label{padding:0 12px;font-size:11px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;border-left:2px solid transparent;transition:background .12s,color .12s}
.nav-item:hover{color:#e2e8f0;background:var(--hover)}
.nav-item.active{background:var(--active);color:var(--ok);border-left-color:var(--accent);font-weight:600}
.nav-item svg{width:16px;height:16px;flex:0 0 16px}
.nav-count{margin-left:auto;font-size:11px;color:var(--muted2)}
.side-foot{padding:12px}
.side-box{padding:14px;border-radius:12px;background:linear-gradient(135deg,#10241b,#0d1612);border:1px solid var(--line2)}
.side-box h4{margin:0 0 6px;font-size:12px;color:#fff;display:flex;align-items:center;gap:6px}
.side-box p{margin:0 0 10px;font-size:11px;color:var(--muted);line-height:1.4}
.side-box .row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{height:56px;flex:0 0 56px;border-bottom:1px solid var(--line);background:rgba(13,16,21,.9);backdrop-filter:blur(6px);display:flex;align-items:center;gap:12px;padding:0 22px}
.topbar .grow{flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.dot.off{background:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:9px;background:var(--panel2);border:1px solid var(--line2);font-size:12px;color:var(--muted)}
.hamburger{display:none;background:none;border:1px solid var(--line2);border-radius:8px;color:var(--muted);padding:6px 9px;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:26px 30px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;color:#fff}
.page-head .sub{color:var(--muted2);font-size:12.5px;margin-top:3px}
/* ---------- primitives ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat small{display:block;color:var(--muted2);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.stat strong{font-size:26px;font-weight:700;color:#fff;letter-spacing:-.02em}
.stat .sub{color:var(--muted2);font-size:11.5px;margin-top:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.panel+.panel{margin-top:14px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.panel-h h2{margin:0;font-size:14px;font-weight:600;color:#fff}
.panel-h .hint{font-size:11.5px;color:var(--muted2);font-weight:400}
.panel-b{padding:16px}
.panel-b.tight{padding:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.muted{color:var(--muted2)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12.5px}
th{color:var(--muted2);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;background:var(--panel2);white-space:nowrap}
tbody tr:hover{background:rgba(20,25,36,.6)}
td .sub{color:var(--muted2);font-size:11.5px;margin-top:2px}
.tablewrap{overflow:auto}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:#20334c;color:#b9d3ff;font-size:11px;font-weight:600;white-space:nowrap}
.tag.ok{background:rgba(16,185,129,.14);color:var(--ok)}
.tag.off{background:rgba(251,113,133,.14);color:var(--bad)}
.tag.warn{background:rgba(251,191,36,.14);color:var(--warn)}
.tag.mute{background:#1b2230;color:var(--muted)}
.btn{font:inherit;font-size:12.5px;border-radius:8px;border:1px solid var(--line2);background:#141924;color:var(--text);padding:7px 12px;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover{background:#1a2230;border-color:#2c3648}
.btn.primary{background:#0f3d2e;border-color:var(--okline);color:var(--ok)}
.btn.primary:hover{background:#12503b}
.btn.danger{color:var(--bad);border-color:rgba(251,113,133,.3)}
.btn.danger:hover{background:rgba(251,113,133,.1)}
.btn.tiny{padding:4px 9px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select{font:inherit;font-size:12.5px;background:var(--input);border:1px solid var(--inputline);color:var(--text);border-radius:8px;padding:8px 10px;max-width:100%}
input:focus,select:focus{outline:none;border-color:rgba(16,185,129,.6)}
input[type=checkbox]{width:auto;padding:0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--muted2)}
.kv dd{margin:0;word-break:break-word}
pre.blk{margin:0;background:#080a0e;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:340px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:#bcd4f7;white-space:pre-wrap;overflow-wrap:anywhere}
.err{color:var(--bad)}
.loading{color:var(--muted2);padding:20px}
.empty{color:var(--muted2);padding:16px;font-size:12.5px}
.toast{position:fixed;right:20px;bottom:20px;max-width:420px;background:#0f1f19;border:1px solid var(--okline);color:var(--ok);padding:11px 14px;border-radius:10px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(8px);transition:.18s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.bad{background:#231016;border-color:rgba(251,113,133,.4);color:var(--bad)}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:35}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.mod{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 8px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
.mod .dot{width:7px;height:7px}
/* ---------- modal (provider test, etc.) ---------- */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(3,5,8,.72);z-index:70;padding:26px;overflow:auto}
.modal-backdrop.show{display:flex;align-items:flex-start;justify-content:center}
.modal{width:100%;max-width:820px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;margin:auto;box-shadow:0 24px 60px rgba(0,0,0,.65)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.modal-h h3{margin:0;font-size:14px;font-weight:600;color:#fff}
.modal-b{padding:16px;display:grid;gap:14px}
.modal-f{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:13px 16px;border-top:1px solid var(--line);background:var(--panel2)}
.x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:19px;line-height:1;padding:2px 7px;border-radius:7px}
.x:hover{background:#1a2230;color:#fff}
td.actions{text-align:right;white-space:nowrap}
td.actions .row{justify-content:flex-end;flex-wrap:nowrap;gap:6px}
.num{width:62px;padding:5px 6px;font-size:12.5px;text-align:center}
.sub-btn{margin-top:5px}
.tsum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sect{margin:12px 0 6px;font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:900px){
  .sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}
  .hamburger{display:inline-block}
  .backdrop.show{display:block}
  .content{padding:18px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div>
      <div class="brand">
        <div class="brand-badge">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
        <div>
          <div class="brand-title">ZombieCoder</div>
          <div class="brand-sub">Admin Control Plane</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
    </div>
    <div class="side-foot">
      <div class="side-box">
        <h4>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v4M3 5h4M6 17v4m-2-2h4M13 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
          Runtime
        </h4>
        <p id="side-status">Connecting…</p>
        <div class="row"><span>Version</span><span class="mono" id="side-version">—</span></div>
        <div class="row"><span>Execution</span><span class="mono" id="side-mode">—</span></div>
        <div class="row"><span>MCP</span><span class="mono" id="side-mcp">—</span></div>
      </div>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <header class="topbar">
      <button class="hamburger" id="burger" title="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="chip"><span class="dot off" id="live-dot"></span><span id="live-text">offline</span></span>
      <div class="grow"></div>
      <input id="token" type="password" autocomplete="off" placeholder="Admin token (not needed on loopback)" style="width:260px">
      <button class="btn primary" data-act="refresh">Refresh</button>
    </header>
    <main class="content">
      <div class="page-head">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <div class="sub" id="page-sub"></div>
        </div>
        <div class="row" id="page-actions"></div>
      </div>
      <div id="view"><div class="loading">Loading…</div></div>
    </main>
  </div>
</div>
<div class="modal-backdrop" id="modal"></div>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
/* ------------------------------------------------------------------ utils */
const el = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dash = v => (v === null || v === undefined || v === '' ? '—' : v);
const bool = v => v ? '<span class="tag ok">yes</span>' : '<span class="tag mute">no</span>';
const statusTag = s => {
  const v = String(s ?? '').toUpperCase();
  const k = (v === 'ENABLED' || v === 'VERIFIED' || v === 'ACTIVE' || v === 'HEALTHY') ? 'ok'
          : (v === 'DISABLED' || v === 'REVOKED' || v === 'ERROR' || v === 'NOT_IMPLEMENTED') ? 'off'
          : (v === 'UNVERIFIED' || v === 'ERROR' || v === 'INCOMPLETE') ? 'warn' : 'mute';
  return '<span class="tag ' + k + '">' + esc(v || 'unknown') + '</span>';
};
const enabledTag = v => v === false ? '<span class="tag off">disabled</span>' : '<span class="tag ok">enabled</span>';
const toast = (msg, bad) => { const t = el('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => { t.className = 'toast'; }, 3200); };
let token = '';
async function api(path, opts) {
  opts = opts || {};
  const headers = {};
  if (token) headers.authorization = 'Bearer ' + token;
  if (opts.body !== undefined) headers['content-type'] = 'application/json';
  const res = await fetch(path, { method: opts.method || 'GET', headers, body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined });
  let data = null; try { data = await res.json(); } catch {}
  if (!res.ok) { const m = (data && (data.error || data.message)) || ('http_' + res.status); const e = new Error(String(m)); e.status = res.status; throw e; }
  return data;
}
const table = (cols, rows, empty) => {
  const body = Array.isArray(rows) ? rows.join('') : String(rows || '');
  return body
    ? '<div class="tablewrap"><table><thead><tr>' + cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' + body + '</tbody></table></div>'
    : '<div class="empty">' + esc(empty || 'Nothing to show.') + '</div>';
};
const panel = (title, hint, body, actions) =>
  '<section class="panel"><div class="panel-h"><h2>' + esc(title) + (hint ? ' <span class="hint">' + esc(hint) + '</span>' : '') + '</h2>' + (actions || '') + '</div>' + body + '</section>';
const stat = (label, value, sub) => '<div class="stat"><small>' + esc(label) + '</small><strong>' + esc(dash(value)) + '</strong>' + (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>';
const jsonBlock = o => '<pre class="blk">' + esc(JSON.stringify(o, null, 2)) + '</pre>';
const kv = o => '<dl class="kv">' + Object.entries(o || {}).map(([k, v]) => '<dt>' + esc(k) + '</dt><dd>' + (v && typeof v === 'object' ? esc(JSON.stringify(v)) : esc(dash(v))) + '</dd>').join('') + '</dl>';
/* ---------------------------------------------------------------- modal */
function openModal(html) { const bd = el('modal'); bd.innerHTML = '<div class="modal">' + html + '</div>'; bd.classList.add('show'); }
function closeModal() { const bd = el('modal'); bd.classList.remove('show'); bd.innerHTML = ''; }
const modalOpen = () => el('modal').classList.contains('show');
/* Health is only meaningful once a probe has actually run: a provider that has
   never been checked must not read as a failure state. */
const healthTag = p => {
  const s = String(p.healthStatus || '').toLowerCase();
  if (s === 'healthy') return '<span class="tag ok">healthy</span>';
  if (s === 'error') return '<span class="tag off">error</span>';
  return '<span class="tag mute">not checked</span>';
};
const when = ts => { if (!ts) return 'never'; const d = new Date(ts); return isNaN(d) ? String(ts) : d.toLocaleString(); };
/* Provider test modal: runs a real, non-streaming completion against the chosen
   provider+model and shows both the request that left the runtime and the raw
   upstream payload that came back. */
function openTestModal(p) {
  const models = Array.isArray(p.models) ? p.models : [];
  const opts = models.length
    ? models.map(m => '<option value="' + esc(m) + '"' + (p.defaultModel === m ? ' selected' : '') + '>' + esc(m) + '</option>').join('')
    : '<option value="">(provider default)</option>';
  openModal(
    '<div class="modal-h"><h3>Test provider · ' + esc(p.name || p.id) + ' <span class="mono muted">' + esc(p.id) + '</span></h3><button class="x" data-act="modal-close" title="Close">×</button></div>' +
    '<div class="modal-b">' +
      '<div class="row" style="gap:12px;align-items:flex-end">' +
        '<label class="f" style="flex:1;min-width:220px">Model<select id="t-model">' + opts + '</select></label>' +
        '<label class="f" style="flex:1;min-width:220px">Or type a model id<input id="t-custom" placeholder="overrides the dropdown"></label>' +
      '</div>' +
      '<label class="f">Prompt<textarea id="t-prompt" style="height:74px;background:var(--input);border:1px solid var(--inputline);border-radius:9px;padding:9px 11px;color:var(--text);font:inherit;resize:vertical">Reply with the single word: ok</textarea></label>' +
      '<div id="t-result" class="muted" style="font-size:12.5px">No request sent yet.</div>' +
    '</div>' +
    '<div class="modal-f"><span id="t-status" class="muted" style="margin-right:auto;font-size:12px">idle</span>' +
      '<button class="btn" data-act="modal-close">Close</button>' +
      '<button class="btn primary" data-act="prov-test-run" data-id="' + esc(p.id) + '">Run test</button>' +
    '</div>'
  );
}
async function runProviderTest(providerId) {
  const sel = el('t-model'), custom = el('t-custom'), prompt = el('t-prompt'), out = el('t-result'), status = el('t-status');
  if (!out) return;
  const model = (custom && custom.value.trim()) || (sel ? sel.value : '');
  out.innerHTML = '<span class="muted">Running request…</span>';
  status.textContent = 'request in flight…';
  try {
    const r = await api('/v1/admin/providers/' + encodeURIComponent(providerId) + '/test', { method: 'POST', body: { model, prompt: prompt ? prompt.value : '' } });
    status.textContent = (r.ok ? 'completed' : 'failed') + ' · ' + r.latencyMs + ' ms' + (r.model ? ' · ' + r.model : '');
    out.innerHTML =
      '<div class="tsum">' + (r.ok ? '<span class="tag ok">success</span>' : '<span class="tag off">failed</span>') +
      (r.model ? '<span class="tag mute">' + esc(r.model) + '</span>' : '') +
      '<span class="tag mute">' + esc(r.latencyMs) + ' ms</span>' +
      (r.error ? '<span class="mono err">' + esc(r.error) + '</span>' : '') + '</div>' +
      '<div class="sect">Request</div>' + jsonBlock(r.request) +
      '<div class="sect">Response' + (r.response ? ' (canonical)' : '') + '</div>' + jsonBlock(r.response || { error: r.error }) +
      (r.upstream ? '<div class="sect">Upstream payload</div>' + jsonBlock(r.upstream) : '');
    return toast('Test ' + (r.ok ? 'succeeded ✓' : 'failed ✗ ' + (r.error || '')), !r.ok);
  } catch (e) {
    status.textContent = 'error';
    out.innerHTML = '<span class="err">' + esc(e.message) + '</span>';
    return toast('Test failed: ' + e.message, true);
  }
}
/* Persona editor. Agents are file-defaults, so the individual behaviour lives
   entirely in the persona row bound to the agent id; this is the only place a
   persona prompt can be changed. */
function openPersonaModal(p, agentId) {
  const f = (id, label, value, extra) => '<label class="f">' + label + '<input id="' + id + '" value="' + esc(value ?? '') + '"' + (extra || '') + '></label>';
  openModal(
    '<div class="modal-h"><h3>Persona · ' + esc((p && p.name) || agentId) + ' <span class="mono muted">' + esc(agentId) + '</span></h3><button class="x" data-act="modal-close" title="Close">×</button></div>' +
    '<div class="modal-b">' +
      '<div class="row" style="gap:12px;align-items:flex-end">' +
        f('pe-name', 'Name', p && p.name, ' style="min-width:200px"') +
        f('pe-role', 'Role', p && p.role, ' style="min-width:160px"') +
        f('pe-exp', 'Expertise', p && p.expertise, ' style="min-width:200px"') +
        f('pe-prio', 'Priority', p ? p.priority : 99, ' type="number" min="1" max="99" style="width:90px"') +
      '</div>' +
      '<label class="f">Persona prompt<textarea id="pe-text" style="height:170px;background:var(--input);border:1px solid var(--inputline);border-radius:9px;padding:10px 12px;color:var(--text);font:inherit;line-height:1.5;resize:vertical">' + esc((p && p.persona) || '') + '</textarea></label>' +

// One EventSource for the whole page, shared by every view that wants the live
// feed. The server only tails the file; all filtering happens here so changing
// a filter never costs a round trip.
let logStream = null;
let liveEvents = [];
const liveSubs = new Set();
function startLogStream(backfill = 60) {
  if (logStream) return logStream;
  const es = new EventSource('/v1/admin/logs/stream?backfill=' + backfill);
  es.onmessage = (ev) => {
    let e; try { e = JSON.parse(ev.data); } catch { return; }
    liveEvents.push(e);
    if (liveEvents.length > 1000) liveEvents = liveEvents.slice(-1000);
    liveSubs.forEach(fn => { try { fn(e); } catch (err) { /* a broken subscriber must not kill the feed */ } });
  };
  es.onerror = () => { /* EventSource reconnects on its own */ };
  logStream = es;
  return es;
}
function stopLogStream() { if (logStream) { logStream.close(); logStream = null; } liveSubs.clear(); }
function onLive(fn) { liveSubs.add(fn); return () => liveSubs.delete(fn); }
const levelTag = l => '<span class="tag ' + (l === 'error' ? 'off' : l === 'warn' ? 'warn' : 'mute') + '">' + esc(l || 'info') + '</span>';
const outcomeTag = o => o === 'failure' ? '<span class="tag off">failure</span>' : o === 'success' ? '<span class="tag ok">success</span>' : (o ? '<span class="tag mute">' + esc(o) + '</span>' : '');
const eventRow = e => '<tr data-level="' + esc(e.level || 'info') + '" data-event="' + esc(e.event || '') + '" data-outcome="' + esc(e.outcome || '') + '">' +

// Inline SVG only: the page must stay self-contained (no CDN, strict CSP), so
// every graph here is a few SVG primitives rather than a charting dependency.
const CHART = { ok: '#34d399', bad: '#fb7185', warn: '#fbbf24', accent: '#10b981', muted: '#64748b', grid: '#1a1f2c' };
function sparkline(values, { w = 320, h = 60, color = CHART.accent } = {}) {
  const vals = (values || []).map(n => (typeof n === 'number' && isFinite(n) ? n : 0));
  if (vals.length < 2) return '<div class="empty" style="padding:14px">not enough data yet</div>';
  const max = Math.max(1, ...vals);
  const step = w / (vals.length - 1);
  const points = vals.map((v, i) => [(i * step).toFixed(1), (h - 4 - (v / max) * (h - 12)).toFixed(1)]);
  const line = points.map(p => p.join(',')).join(' ');
  const area = '0,' + h + ' ' + line + ' ' + w + ',' + h;
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" width="100%" height="' + h + '">' +
    '<polygon points="' + area + '" fill="' + color + '" opacity="0.15"></polygon>' +
    '<polyline points="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>' +
    '</svg>';
}
function barPairs(items, { w = 560, h = 130 } = {}) {
  const list = (items || []).filter(Boolean);
  if (!list.length) return '<div class="empty" style="padding:14px">no runs recorded yet</div>';
  const max = Math.max(1, ...list.map(i => (i.ok || 0) + (i.bad || 0)));
  const slot = (w - 8) / list.length;
  const bw = Math.max(8, Math.min(38, slot - 8));
  const bars = list.map((it, i) => {
    const x = 4 + i * slot + (slot - bw) / 2;
    const okH = ((it.ok || 0) / max) * (h - 30);
    const badH = ((it.bad || 0) / max) * (h - 30);
    const y0 = h - 20 - okH;
    return '<rect x="' + x.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0, okH).toFixed(1) + '" rx="2" fill="' + CHART.ok + '"><title>' + esc(it.label) + ': ' + (it.ok || 0) + ' ok</title></rect>' +
      (badH ? '<rect x="' + x.toFixed(1) + '" y="' + (y0 - badH).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + badH.toFixed(1) + '" rx="2" fill="' + CHART.bad + '"><title>' + esc(it.label) + ': ' + (it.bad || 0) + ' failed</title></rect>' : '') +
      '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 5) + '" font-size="9" fill="' + CHART.muted + '" text-anchor="middle">' + esc(String(it.label).slice(0, 10)) + '</text>';
  }).join('');
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '">' + bars + '</svg>';
}
function donut(segments, { size = 140, thickness = 16 } = {}) {
  const segs = (segments || []).filter(s => s.value > 0);
  const total = segs.reduce((n, s) => n + s.value, 0);
  if (!total) return '<div class="empty" style="padding:14px">no data yet</div>';
  const r = (size - thickness) / 2;
  const c = 2 * Math.PI * r;
  let acc = 0;
  const arcs = segs.map(s => {
    const len = (s.value / total) * c;
    const el = '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + s.color + '" stroke-width="' + thickness +
      '" stroke-dasharray="' + len.toFixed(2) + ' ' + (c - len).toFixed(2) + '" stroke-dashoffset="' + (-acc).toFixed(2) +
      '" transform="rotate(-90 ' + size / 2 + ' ' + size / 2 + ')"><title>' + esc(s.label || '') + ': ' + s.value + '</title></circle>';
    acc += len;
    return el;
  }).join('');
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' + arcs +
    '<text x="' + size / 2 + '" y="' + (size / 2) + '" text-anchor="middle" font-size="24" fill="' + CHART.ok + '" font-weight="600">' + total + '</text>' +
    '<text x="' + size / 2 + '" y="' + (size / 2 + 17) + '" text-anchor="middle" font-size="10" fill="' + CHART.muted + '">total</text></svg>';
}
const legend = items => '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px">' + (items || []).map(i =>

    const fp = el('m-filter').value, q = el('m-search').value.toLowerCase();
    draw(models.filter(m => (!fp || m.providerId === fp) && (!q || m.model.toLowerCase().includes(q))));

VIEWS['masking-models'] = { title: 'Masking Models', sub: 'Public routing aliases and which upstream model each one resolves to', render: async (v) => {
  const [{ models }, { providers }] = await Promise.all([api('/v1/admin/masking-models'), api('/v1/admin/providers')]);
  // Ask the real router what each alias resolves to right now (same code path a
  // client request takes), so the table can never drift from actual behaviour.
  const routes = {};
  await Promise.all(models.map(async m => {
    try { routes[m.id] = (await api('/v1/admin/providers/route', { method: 'POST', body: { model: m.id } })).route; }
    catch (e) { routes[m.id] = { error: e.message, candidates: [] }; }
  }));

  const profileRows = models.map(m => {
    const r = routes[m.id] || {};
    const winner = r.providerId
      ? '<span class="mono">' + esc(r.providerId) + '</span> → <span class="mono">' + esc(r.model) + '</span>'
      : '<span class="tag off">no candidate</span><div class="sub err">' + esc(r.error || '') + '</div>';
    const explicit = (r.candidates || []).filter(c => c.explicitAlias).length;
    return '<tr><td><strong>' + esc(m.name || m.id) + '</strong><div class="sub mono">' + esc(m.id) + '</div></td>' +
      '<td>' + esc(m.description || '') + '</td>' +
      '<td>' + winner + '<div class="sub muted">' + esc(r.reason || '') + '</div></td>' +
      '<td>' + (r.candidates || []).length + '<div class="sub">' + explicit + ' explicit</div></td></tr>';
  }).join('');

  const mappingRows = providers.map(p => {
    const pm = Array.isArray(p.models) ? p.models : [];
    const cell = alias => {
      const cur = (p.modelAliases || {})[alias] || '';
      let opts = '<option value="">— default (' + esc(p.defaultModel || 'none') + ') —</option>';
      opts += pm.map(m => '<option value="' + esc(m) + '"' + (cur === m ? ' selected' : '') + '>' + esc(m) + '</option>').join('');
      if (cur && !pm.includes(cur)) opts += '<option value="' + esc(cur) + '" selected>' + esc(cur) + ' (not in catalog)</option>';
      return '<td><select data-alias="' + esc(alias) + '" style="max-width:190px">' + opts + '</select></td>';
    };
    return '<tr><td><strong>' + esc(p.name || p.id) + '</strong><div class="sub mono">' + esc(p.id) + '</div>' +
      (p.enabled === false ? '<div class="sub"><span class="tag off">disabled</span></div>' : '') + '</td>' +
      models.map(m => cell(m.id)).join('') +
      '<td class="actions"><button class="btn tiny primary" data-act="alias-save" data-id="' + esc(p.id) + '">Save</button></td></tr>';
  }).join('');

  v.innerHTML =
    panel('Masking models', models.length + ' public alias(es)', table(['Alias', 'Purpose', 'Resolves to right now', 'Candidates'], profileRows, 'No masking models.')) +
    panel('Model mapping', 'pin an alias to a concrete model, per provider', table(['Provider'].concat(models.map(m => m.id)).concat(['']), mappingRows, 'No providers registered.')) +
    panel('Simulate a route', 'runs the real router, no request is sent upstream', '<div class="panel-b"><div class="row" style="align-items:flex-end">' +
      '<label class="f">Alias<select id="sim-alias">' + models.map(m => '<option>' + esc(m.id) + '</option>').join('') + '</select></label>' +
      '<label class="f">Provider<select id="sim-provider"><option value="">any enabled</option>' + providers.map(p => '<option value="' + esc(p.id) + '">' + esc(p.id) + '</option>').join('') + '</select></label>' +
      '<button class="btn primary" data-act="alias-simulate">Simulate route</button></div>' +
      '<div id="sim-out" style="margin-top:12px"><span class="muted">Pick an alias and simulate to see the candidate order.</span></div></div>') +
    panel('How this works', '', '<div class="panel-b"><p class="muted" style="font-size:12.5px;margin:0">A client sends <span class="mono">model: "zombie-mini"</span>. The router looks for a provider that <b>explicitly maps</b> that alias (the table above); explicit mappings outrank providers that merely fall back to their default model. Among equals, lower <span class="mono">priority</span> wins, and the next candidate becomes the failover target. Clients only ever see the alias — the real provider and model stay server-side.</p></div>');
} };

// The agent tool-access scope. `global` means any folder on the host;
// `working-directory` pins every tool to the agent's own directory.
function scopeCell(a, au) {
  const mode = a.toolBoundary === 'working-directory' ? 'working-directory' : 'global';
  const badge = mode === 'working-directory'
    ? '<span class="tag warn">working-directory</span><div class="sub mono">' + esc(a.workingDirectory || 'not set') + '</div>'

  const tools = au ? '<div class="sub">' + (au.toolIds || []).length + ' explicit tool(s)</div>' : '';
  return badge + tools;
}

  const matches = (e, f) => {
    if (f.level !== 'all' && String(e.level || 'info') !== f.level) return false;
    if (f.outcome !== 'all' && String(e.outcome || '') !== f.outcome) return false;
    if (f.event && !String(e.event || '').toLowerCase().includes(f.event)) return false;
    if (f.text && !JSON.stringify(e).toLowerCase().includes(f.text)) return false;
    return true;
  };
  const stats = () => {
    const rows = liveEvents.filter(e => matches(e, readFilters()));
    const ok = rows.filter(e => e.outcome === 'success' || (e.statusCode >= 200 && e.statusCode < 400)).length;
    const fail = rows.filter(e => e.outcome === 'failure' || e.level === 'error' || e.statusCode >= 400).length;
    const lat = rows.map(e => e.durationMs).filter(n => typeof n === 'number');
    el('ls-total').textContent = rows.length;
    el('ls-ok').textContent = ok;
    el('ls-fail').textContent = fail;
    el('ls-avg').textContent = lat.length ? Math.round(lat.reduce((a, b) => a + b, 0) / lat.length) + ' ms' : '—';
  };
  const rebuild = () => {
    const rows = liveEvents.filter(e => matches(e, readFilters())).slice(-300).reverse();
    feed.innerHTML = rows.map(eventRow).join('');
    empty.style.display = rows.length ? 'none' : 'block';
    stats();
  };
  const append = (e) => {
    if (!paused && matches(e, readFilters())) {
      feed.insertAdjacentHTML('afterbegin', eventRow(e));
      while (feed.children.length > 300) feed.removeChild(feed.lastChild);
      empty.style.display = 'none';
    }
    stats();
  };
  ['lf-level', 'lf-outcome', 'lf-event', 'lf-text'].forEach(id => el(id).addEventListener('input', rebuild));
  el('ls-clear').addEventListener('click', () => { liveEvents = []; rebuild(); empty.textContent = 'Cleared — waiting for new events…'; });
  el('ls-toggle').addEventListener('click', () => {
    paused = !paused;
    el('ls-toggle').textContent = paused ? 'Resume' : 'Pause';
    el('ls-toggle').className = 'btn' + (paused ? '' : ' primary');
    el('ls-state').textContent = paused ? 'paused' : 'streaming';
    if (!paused) rebuild();
  });
  // Subscriber first, then the stream: an event that lands between the two
  // would otherwise sit in liveEvents but never reach the DOM.
  const off = onLive(append);
  startLogStream(80);
  el('ls-state').textContent = 'streaming';
  rebuild();
  currentTeardown = () => { off(); stopLogStream(); };
} };

/* metrics */
// Counts are shown as cards and graphs; the raw JSON is still available but
// demoted into a collapsed <details> so it is never the primary view.
// The request graph is fed by the same live SSE stream as the Requests page,
// so it needs no polling and no second connection.
const METRIC_BUCKET_MS = 5000;
const METRIC_BUCKETS = 12;
function metricBuckets(events) {
  const now = Date.now();
  const buckets = Array.from({ length: METRIC_BUCKETS }, () => ({ total: 0, ok: 0, bad: 0 }));
  for (const e of events) {
    const t = Date.parse(e.ts || '');
    if (!isFinite(t)) continue;
    const age = now - t;
    if (age < 0 || age > METRIC_BUCKET_MS * METRIC_BUCKETS) continue;
    const idx = METRIC_BUCKETS - 1 - Math.floor(age / METRIC_BUCKET_MS);
    if (idx < 0 || idx >= METRIC_BUCKETS) continue;
    const b = buckets[idx];
    b.total += 1;
    if (e.outcome === 'failure' || e.level === 'error' || e.statusCode >= 400) b.bad += 1;
    else if (e.outcome === 'success' || (e.statusCode >= 200 && e.statusCode < 400)) b.ok += 1;
  }
  return buckets;
}

  // of events cannot repaint on every single frame.
  const paint = () => {

    const total = buckets.reduce((n, b) => n + b.total, 0);
    const ok = buckets.reduce((n, b) => n + b.ok, 0);

    const now = Date.now();

    if (pending) return;
    pending = setTimeout(() => { pending = null; lastPaint = Date.now(); paint(); }, 1500);

    agentTimer = setTimeout(async () => {
      agentTimer = null;

  });
  startLogStream(80);
  paint();
  currentTeardown = () => { off(); if (pending) clearTimeout(pending); if (agentTimer) clearTimeout(agentTimer); };
} };

const TESTER_ID_SOURCES = [

];

document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  const done = (m, bad) => { toast(m, bad); sideStatus(); setTimeout(() => VIEWS[current] && VIEWS[current].render(el('view')).catch(() => {}), 300); };
  try {
    if (act === 'modal-close') { closeModal(); return; }
    if (act === 'refresh') { await sideStatus(); await (VIEWS[current] || VIEWS.dashboard).render(el('view')); toast('Refreshed'); return; }

      const r = await api('/v1/admin/providers/' + encodeURIComponent(b.dataset.id) + '/health', { method: 'POST', body: {} });
      const s = (r.health && r.health.status) || 'unknown';
      return done(b.dataset.id + ': health ' + (s === 'healthy' ? 'PASSED ✓' : 'FAILED ✗ ' + ((r.health && r.health.error) || '')), s !== 'healthy');

      if (t.missing) return toast('This route needs a real ' + t.missing + ' id first', true);
      if (t.readOnly) { await testerRunOne(i); return; }
      // Mutating: never fire an invented payload silently.
      const prefill = TESTER_DEFAULT_BODIES[t.method + ' ' + t.path];
      return openModal(
        '<div class="modal-h"><h3>' + esc(t.method) + ' <span class="mono">' + esc(t.resolved) + '</span></h3><button class="x" data-act="modal-close" title="Close">×</button></div>' +
        '<div class="modal-b">' +
          '<p class="muted" style="font-size:12px;margin:0 0 8px">' + esc(t.description || '') + '</p>' +
          '<p class="muted" style="font-size:11.5px;margin:0 0 10px">This route changes state. Review the body before sending.</p>' +
          '<label class="f">Request body (JSON)' +
          '<textarea id="probe-body" style="height:150px;background:var(--input);border:1px solid var(--inputline);border-radius:9px;padding:10px;color:var(--text);font:12px ui-monospace,Menlo,Consolas,monospace;resize:vertical">' + esc(JSON.stringify(prefill ?? {}, null, 2)) + '</textarea></label>' +
          '<div id="probe-result" style="margin-top:10px"></div>' +
        '</div>' +
        '<div class="modal-f"><span class="muted" style="margin-right:auto;font-size:11.5px">no payload is sent until you press Send</span>' +
          '<button class="btn" data-act="modal-close">Cancel</button>' +
          '<button class="btn danger" data-act="probe-send" data-i="' + i + '">Send request</button>' +
        '</div>');
    }
    if (act === 'probe-send') {
      const i = Number(b.dataset.i);
      let payload;
      const raw = el('probe-body').value.trim();
      if (raw) { try { payload = JSON.parse(raw); } catch (e) { return toast('Body is not valid JSON: ' + e.message, true); } }
      const out = el('probe-result');
      out.innerHTML = '<span class="muted">Sending…</span>';
      const r = await testerRunOne(i, payload);
      out.innerHTML = '<div class="tsum" style="margin-bottom:8px">' + (r.ok ? '<span class="tag ok">' + esc(r.status) + '</span>' : '<span class="tag off">' + esc(r.status || 'error') + '</span>') + '<span class="tag mute">' + esc(r.ms) + ' ms</span></div>' + jsonBlock(r.error ? { error: r.error } : r.data);
      return;
    }
    if (act === 'probe-view') {
      const i = Number(b.dataset.i);
      const r = testerState && testerState.results[i];
      const t = testerState && testerState.targets[i];
      if (!r || !t) return;
      return openModal(
        '<div class="modal-h"><h3>' + esc(t.method) + ' <span class="mono">' + esc(t.resolved) + '</span></h3><button class="x" data-act="modal-close" title="Close">×</button></div>' +
        '<div class="modal-b"><div class="tsum" style="margin-bottom:10px">' + (r.ok ? '<span class="tag ok">' + esc(r.status) + '</span>' : '<span class="tag off">' + esc(r.status || 'error') + '</span>') + '<span class="tag mute">' + esc(r.ms) + ' ms</span><span class="tag mute">' + esc(t.description || '') + '</span></div>' +
        jsonBlock(r.error ? { error: r.error } : r.data) + '</div>' +
        '<div class="modal-f"><button class="btn" data-act="modal-close">Close</button></div>');
    }
    if (act === 'probe-custom') {
      const method = el('cq-method').value;
      const path = el('cq-path').value.trim();
      const out = el('cq-out');
      if (!path) return toast('A path is required', true);
      const raw = el('cq-body').value.trim();
      let payload;
      if (raw && method !== 'GET') { try { payload = JSON.parse(raw); } catch (e) { return toast('Body is not valid JSON: ' + e.message, true); } }
      out.innerHTML = '<span class="muted">Sending…</span>';
      const r = await runProbe({ method, path, resolved: path, description: 'custom request', readOnly: method === 'GET', stream: /\/stream$/.test(path) }, payload);
      out.innerHTML = '<div class="tsum" style="margin-bottom:8px">' + (r.ok ? '<span class="tag ok">' + esc(r.status) + '</span>' : '<span class="tag off">' + esc(r.status || 'error') + '</span>') + '<span class="tag mute">' + esc(r.ms) + ' ms</span></div>' + jsonBlock(r.error ? { error: r.error } : r.data);
      return;
    }
    if (act === 'agent-add') {
      const id = el('a-id').value.trim(); if (!id) return toast('id required', true);
      const name = el('a-name').value.trim() || id;
      const role = el('a-role').value.trim() || 'general';
      const persona = el('a-persona').value.trim() || ('You are ' + name + '. ' + role + '.');
      await api('/v1/admin/registry/agents', { method: 'POST', body: { id, name, role, capabilities: role ? [role] : [] } });
      await api('/v1/admin/personas', { method: 'POST', body: { id, name, role, expertise: role, priority: 50, persona } });
      return done('Agent + persona ' + id + ' created ✓');
    }
    if (act === 'map-save') { await api('/v1/admin/agent-model-mappings/' + encodeURIComponent(el('map-agent').value), { method: 'PUT', body: { model: el('map-model').value } }); return done('Mapping saved'); }
    if (act === 'map-del') { await api('/v1/admin/agent-model-mappings/' + encodeURIComponent(b.dataset.id), { method: 'DELETE' }); return done('Mapping removed'); }
    if (act === 'tool-toggle') {
      const on = b.dataset.on === 'true';
      await api('/v1/admin/registry/tools/' + encodeURIComponent(b.dataset.id), { method: 'PATCH', body: { status: on ? 'DISABLED' : 'ENABLED' } });
      return done(b.dataset.id + (on ? ' disabled ✓' : ' enabled ✓'));
    }
    if (act === 'perm-grant') { await api('/v1/admin/tools/permissions', { method: 'POST', body: { applicationId: el('perm-app').value, toolId: el('perm-tool').value } }); return done('Permission granted ✓'); }
    if (act === 'perm-revoke') { await api('/v1/admin/tools/permissions', { method: 'DELETE', body: { applicationId: b.dataset.app, toolId: b.dataset.tool } }); return done('Permission revoked ✓'); }
    if (act === 'mcp-discover') {
      const r = await api('/v1/admin/mcp/endpoints/' + encodeURIComponent(b.dataset.id) + '/discover', { method: 'POST', body: {} });
      lastMcpVerify = { id: r.endpoint.id, count: (r.endpoint.tools || []).length, tools: (r.endpoint.tools || []).map(t => t.qualifiedName) };
      return done('Endpoint ' + r.endpoint.id + ' verified · ' + lastMcpVerify.count + ' tool(s) ✓');
    }
    if (act === 'mcp-remove') {
      if (!confirm('Remove MCP endpoint ' + b.dataset.id + ' and its discovered tools?')) return;
      await api('/v1/admin/mcp/endpoints/' + encodeURIComponent(b.dataset.id), { method: 'DELETE' });
      return done('MCP endpoint ' + b.dataset.id + ' removed ✓');
    }
    if (act === 'mcp-client-close') {
      await api('/v1/admin/mcp/clients/' + encodeURIComponent(b.dataset.id), { method: 'DELETE' });
      return done('Client session disconnected ✓');
    }
    if (act === 'mcp-auth-toggle') {
      const next = b.dataset.next === 'true';
      const r = await api('/v1/admin/mcp/auth', { method: 'PATCH', body: { requireAuth: next } });
      // done() re-renders the view, so the panel reflects the new policy.
      return done(next ? 'Authentication required on /mcp ✓' : 'Authentication disabled on /mcp ✓' + (r.localApplication ? ' · ' + r.localApplication.id : ''));
    }
    if (act === 'mcp-auth-reset') {
      await api('/v1/admin/mcp/auth', { method: 'DELETE' });
      return done('Auth policy reset to the environment default ✓');
    }
    if (act === 'mcp-verify') {
      const url = el('m-url').value.trim();
      const apiKey = el('m-apikey').value.trim();
      const id = el('m-id').value.trim();
      const hosts = el('m-hosts').value.split(',').map(s => s.trim()).filter(Boolean);
      const out = el('m-out');
      if (!url) return toast('A base URL is required', true);
      out.innerHTML = '<span class="muted">Registering endpoint…</span>';
      let endpoint;
      try {
        endpoint = (await api('/v1/admin/mcp/endpoints', { method: 'POST', body: { url, apiKey: apiKey || undefined, id: id || undefined, name: id || undefined, allowHosts: hosts } })).endpoint;
      } catch (e) {
        out.innerHTML = '<span class="err">register failed: ' + esc(e.message) + '</span>';
        return toast('MCP register failed: ' + e.message, true);
      }
      out.innerHTML = '<span class="muted">Verifying ' + esc(endpoint.id) + ' — initialize → tools/list…</span>';
      try {
        const r = await api('/v1/admin/mcp/endpoints/' + encodeURIComponent(endpoint.id) + '/discover', { method: 'POST', body: {} });
        lastMcpVerify = { id: r.endpoint.id, count: (r.endpoint.tools || []).length, tools: (r.endpoint.tools || []).map(t => t.qualifiedName) };
        return done('MCP endpoint ' + r.endpoint.id + ' verified · ' + lastMcpVerify.count + ' tool(s) added ✓');
      } catch (e) {
        out.innerHTML = '<span class="err">verification failed: ' + esc(e.message) + '</span><p class="muted" style="font-size:11.5px;margin:8px 0 0">The endpoint is registered but no tools were added. Check the base URL and API key, then press Verify on the endpoint row.</p>';
        return toast('MCP verification failed: ' + e.message, true);
      }
    }
    if (act === 'mcp-perm-grant') {
      const qualifiedName = el('mp-name').value;
      if (!qualifiedName) return toast('No MCP tool to grant yet — add an endpoint first', true);
      await api('/v1/admin/mcp/permissions', { method: 'POST', body: { applicationId: el('mp-app').value, qualifiedName } });
      return done('MCP permission granted ✓');
    }
    if (act === 'mcp-perm-revoke') {
      await api('/v1/admin/mcp/permissions', { method: 'DELETE', body: { applicationId: b.dataset.app, qualifiedName: b.dataset.name } });
      return done('MCP permission revoked ✓');
    }
    if (act === 'mcp-reconcile') { await api('/v1/admin/mcp/reconcile', { method: 'POST', body: {} }); return done('Reconciled ✓'); }
    if (act === 'mcp-sync') { await api('/v1/admin/registry/external-mcp/sync', { method: 'POST', body: {} }); return done('External MCP synced ✓'); }
    if (act === 'app-add') { const name = el('app-name').value.trim() || 'application'; const r = await api('/v1/admin/applications', { method: 'POST', body: { name } }); prompt('Application key (copy now, shown once):', r.apiKey); return done('Application created'); }
    if (act === 'app-rotate') { const r = await api('/v1/admin/applications/' + encodeURIComponent(b.dataset.id) + '/rotate-key', { method: 'POST', body: {} }); prompt('New application key (copy now):', r.apiKey); return done('Key rotated'); }
    if (act === 'app-revoke') { if (!confirm('Revoke ' + b.dataset.id + '?')) return; await api('/v1/admin/applications/' + encodeURIComponent(b.dataset.id) + '/revoke', { method: 'POST', body: {} }); return done('Application revoked'); }
  } catch (e) { toast(act + ' failed: ' + e.message, true); }
});

/* ----------------------------------------------------------------- chrome */
el('token').addEventListener('change', async (e) => { token = e.target.value.trim(); await sideStatus(); if (VIEWS[current]) VIEWS[current].render(el('view')).catch(() => {}); });
el('burger').addEventListener('click', () => { el('sidebar').classList.toggle('open'); el('backdrop').classList.toggle('show'); });
el('backdrop').addEventListener('click', () => { el('sidebar').classList.remove('open'); el('backdrop').classList.remove('show'); });
el('modal').addEventListener('click', (e) => { if (e.target === el('modal')) closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (modalOpen()) { closeModal(); return; }
  el('sidebar').classList.remove('open'); el('backdrop').classList.remove('show');
});

buildNav();
sideStatus();
go();
})();
</script>
</body>
</html>

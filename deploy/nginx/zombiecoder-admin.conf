# ZombieCoder admin front door.
# The runtime binds 127.0.0.1 only and ships no UI. This server adds the two things
# a remote operator needs: TLS and a request-rate ceiling. It never rewrites bodies;
# auth stays the runtime's bearer token, checked on every call.

limit_req_zone  $binary_remote_addr zone=zc_api:10m   rate=30r/s;
limit_req_zone  $binary_remote_addr zone=zc_admin:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=zc_conn:10m;

server {
    listen 8080;
    server_name _;
    return 308 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/zombiecoder.crt;
    ssl_certificate_key /etc/nginx/certs/zombiecoder.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:zc_tls:10m;
    ssl_session_timeout 1h;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 2m;

    location = / { return 302 /admin-ui/; }

    # The static console stays a separate client: nginx proxies the loopback
    # server that owns the files. No runtime code learns about it.
    location /admin-ui/ {
        proxy_pass http://127.0.0.1:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tighter ceiling on the control plane: a page load fires ~10 calls, so burst
    # has to fit that, but sustained guessing is cut to 10 r/s per address.
    location ^~ /v1/admin/ {
        limit_req zone=zc_admin burst=30 nodelay;
        limit_req_status 429;
        limit_conn zc_conn 20;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Chat/completions: streaming must not be buffered by the proxy.
    location /v1/ {
        limit_req zone=zc_api burst=80 nodelay;
        limit_req_status 429;
        limit_conn zc_conn 20;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://127.0.0.1:9999;
        proxy_set_header Host $host;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:9999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
